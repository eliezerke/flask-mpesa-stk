<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Secure Payment</title>
    <style>
        /* Modern CSS Variables & Resets */
        :root {
            --primary: #4caf50;
            --primary-hover: #439a46;
            --primary-light: #e8f5e9;
            --primary-dark: #2e7d32;
            --danger: #ef5350;
            --danger-light: #ffebee;
            --danger-dark: #c62828;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: screen;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Layout */
        .checkout-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            max-width: 420px;
            width: 100%;
            padding: 32px;
        }

        /* Typography styling */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Interactive Banners */
        .banner {
            display: none;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .banner.success {
            display: block;
            background-color: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .banner.error {
            display: block;
            background-color: var(--danger-light);
            color: var(--danger-dark);
            border: 1px solid rgba(239, 83, 80, 0.2);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-main);
            background-color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }

        .form-group .hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            display: block;
        }

        /* Button Action Styles */
        .submit-button {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 24px;
        }

        .submit-button:hover {
            background-color: var(--primary-hover);
        }

        .submit-button:focus {
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.4);
            outline: none;
        }

        .submit-button:disabled {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        /* CSS Loading Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        .submit-button:disabled .spinner {
            display: inline-block;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: #64748b;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <div class="header">
            <h2>Secure Checkout</h2>
            <p>Enter your details to initiate an M-Pesa STK Push payment to your handset</p>
        </div>

        <!-- Dynamic Feedback Panel -->
        <div id="status-banner" class="banner"></div>

        <form id="payment-form">
            <div class="form-group">
                <label for="phone">M-Pesa Phone Number</label>
                <input type="tel" id="phone" required placeholder="254700000000">
                <span class="hint">Format must explicitly begin with country code: 254XXXXXXXXX</span>
            </div>

            <div class="form-group">
                <label for="amount">Amount (KES)</label>
                <input type="number" id="amount" required min="1" value="1">
            </div>

            <div class="form-group">
                <label for="reference">Account Reference</label>
                <input type="text" id="reference" required placeholder="e.g., Invoice #8843">
            </div>

            <button type="submit" id="submit-btn" class="submit-button">
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">Pay with M-Pesa</span>
            </button>
        </form>
    </div>

    <script>
document.getElementById('payment-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    // Select raw form field elements and action indicators
    const phoneField = document.getElementById('phone');
    const amountField = document.getElementById('amount');
    const referenceField = document.getElementById('reference');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');

    const phoneInput = phoneField.value.trim();
    const amountInput = amountField.value;
    const referenceInput = referenceField.value.trim();

    // Strict phone validation pattern formatting guard
    if (!/^254\d{9}$/.test(phoneInput)) {
        showBanner('Phone number must start with 254 followed by 9 digits.', 'error');
        return;
    }

    // Locking the user interface and transition into a processing visual layout on ui
    submitBtn.disabled = true;
    phoneField.disabled = true;
    amountField.disabled = true;
    referenceField.disabled = true;
    btnText.innerText = 'Sending STK Push...';
    hideBanner();

    const payload = {
        PhoneNumber: phoneInput,
        Amount: parseInt(amountInput, 10),
        Reference: referenceInput,
        CallBackURL: `${window.location.origin}/mpesa/callback`
    };

    try {
        const response = await fetch('/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.CheckoutRequestID) {
            showBanner("STK Push initiated! Please verify the prompt on your phone handset screen...", "success");
            btnText.innerText = "Awaiting PIN Input...";
            
            // Activate the short polling background loop watching the sqlite database table rows
            pollStatus(result.CheckoutRequestID);
        } else {
            const errorMsg = result.CustomerMessage || result.errorMessage || 'Initialization failed. Try again.';
            showBanner(errorMsg, 'error');
            resetFormState();
        }

    } catch (error) {
        console.error("Initialization error:", error);
        showBanner('A network timeout error occurred.', 'error');
        resetFormState();
    }
});

// Background tracking poller function
async function pollStatus(checkoutId) {
    let attempts = 0;
    const maxAttempts = 30; // Terminate interval loops completely after 90 seconds (30 * 3s)
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');

    const interval = setInterval(async () => {
        attempts++;
        
        if (attempts >= maxAttempts) {
            clearInterval(interval);
            showBanner("Transaction verification timed out. Please check your M-Pesa balance records.", "error");
            resetFormState();
            return;
        }

        try {
            const response = await fetch(`/api/payment-status/${checkoutId}`);
            if (response.ok) {
                const data = await response.json();

                if (data.status === "success") {
                    clearInterval(interval);
                    showBanner(`Success: ${data.message}`, "success");
                    submitBtn.disabled = true; // Keep button permanently locked on success
                    btnText.innerText = 'Payment Successful';
                } 
                else if (data.status === "failed") {
                    clearInterval(interval);
                    // Renders direct custom strings from Safaricom like "Request canceled by user."
                    showBanner(`Payment Refused: ${data.message}`, "error");
                    resetFormState();
                }
                // If data.status is 'pending', ignore this loop iteration and wait for the next 3-second cycle
            }
        } catch (err) {
            console.error("Poller heartbeat tracking connection failure:", err);
        }
    }, 3000); // Trigger check execution loops every 3000ms (3 seconds)
}

// Helper cleanup method to reset interactive elements on failure/timeout
function resetFormState() {
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('phone').disabled = false;
    document.getElementById('amount').disabled = false;
    document.getElementById('reference').disabled = false;
    document.getElementById('btn-text').innerText = 'Pay with M-Pesa';
}

function showBanner(message, type) {
    const banner = document.getElementById('status-banner');
    banner.innerText = message;
    banner.className = `banner ${type}`;
}

function hideBanner() {
    document.getElementById('status-banner').className = 'banner';
}

    </script>
</body>
</html>
